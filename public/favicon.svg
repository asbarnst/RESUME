<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Dark Italian Navy Glass Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Italian Tricolore Accent (Green #008c45 - White #ffffff - Red #cd212a with Azzurri #0284c7) -->
    <linearGradient id="italy-tricolor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008c45" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cd212a" />
    </linearGradient>

    <!-- Gold / Academic Violet Monogram Accent -->
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle with Italian Tricolore Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="url(#italy-tricolor)" stroke-width="12" />

  <!-- Academic Crest Shield -->
  <path d="M 256 95 L 375 142 V 255 C 375 340 256 405 256 405 C 256 405 137 340 137 255 V 142 Z" fill="url(#shield-bg)" stroke="url(#gold-accent)" stroke-width="6" filter="url(#glow)" />

  <!-- Graduation Mortarboard Cap -->
  <path d="M 256 125 L 345 160 L 256 195 L 167 160 Z" fill="url(#gold-accent)" />
  <path d="M 207 182 V 212 C 207 222 229 230 256 230 C 283 230 305 222 305 212 V 182" fill="none" stroke="url(#gold-accent)" stroke-width="5" />
  <circle cx="345" cy="160" r="4" fill="#ffffff" />
  <path d="M 345 160 V 200" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Monogram "MA" inside Academic Shield -->
  <g fill="url(#gold-accent)" filter="url(#glow)">
    <path d="M 180 345 V 245 L 222 310 L 256 260 L 290 310 L 332 245 V 345 H 306 V 288 L 274 332 H 238 L 206 288 V 345 Z" />
  </g>

  <!-- Top Academic Italian Emblem Star -->
  <circle cx="256" cy="65" r="16" fill="#060c1a" stroke="url(#italy-tricolor)" stroke-width="4" />
  <path d="M 256 56 L 259 62 L 265 65 L 259 68 L 256 74 L 253 68 L 247 65 L 253 62 Z" fill="#38bdf8" />
</svg>